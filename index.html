<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Révisions TMI</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Révisions"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#66717f;--ac:#1f5fbf;--ln:#dde2e8;--ok:#1d7a4a;--ko:#b3342b;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#14181d;--card:#1d232b;--tx:#e8ecf1;--mu:#98a3b1;--ac:#6ea4f0;--ln:#2e3641;--ok:#2f8f5b;--ko:#c4453b}}
*{box-sizing:border-box}html,body{margin:0}body{font:17px/1.45 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top)}
main{padding:12px 16px 110px;max-width:640px;margin:0 auto}h1{font-size:26px;margin:8px 0 14px}h2{font-size:19px;margin:20px 0 8px}small{color:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:58px;background:none;border:0;color:var(--mu);font:inherit;font-size:13px}nav button.on{color:var(--ac);font-weight:700}
.c{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:0 0 12px}
input:not([type=checkbox]):not([type=file]),select,textarea{font:inherit;min-height:48px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);padding:8px 12px;width:100%;margin:6px 0}
.b{display:block;width:100%;min-height:50px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600;margin:8px 0;text-align:center;padding:12px}
.b.g{background:none;color:var(--ac);border:1px solid var(--ln)}.b.ok{background:var(--ok);color:#fff;border:0}.b.ko{background:var(--ko);color:#fff;border:0}.b:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .b{flex:1;min-width:110px;min-height:44px;margin:4px 0}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q{font-size:21px;font-weight:600;margin:12px 0}.an{padding:10px;border-left:3px solid var(--ac);background:var(--bg)}.okt{color:var(--ok)}.kot{color:var(--ko)}
details.ch{margin:8px 0 0 8px}summary{min-height:44px;display:flex;align-items:center;gap:8px}.nt{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--ln)}
.nt .row{flex-shrink:0;width:150px}.wk{display:flex;gap:6px;margin-top:6px}.dot{flex:1;text-align:center;background:var(--ac);color:#fff;border-radius:8px;padding:8px 0;font-size:14px}.ck{display:block;min-height:44px;padding:10px 0}
pre{white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;color:var(--mu);margin:8px 0 0}</style><script src="pdf-lib.min.js"></script></head><body><main id="v"></main><nav></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DB=new Promise((res,rej)=>{const r=indexedDB.open('tmi',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('notions',{keyPath:'id'});d.createObjectStore('kv');d.createObjectStore('jobs',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(st,m,f)=>{const d=await DB;return new Promise((res,rej)=>{const t=d.transaction(st,m),q=f(t.objectStore(st));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const put=(st,v,k)=>tx(st,'readwrite',o=>o.put(v,k)),get=(st,k)=>tx(st,'readonly',o=>o.get(k)),all=st=>tx(st,'readonly',o=>o.getAll()),del=(st,k)=>tx(st,'readwrite',o=>o.delete(k));
const T=['Aujourd’hui','Cours','Importer','Réglages'],PD={mistral:{base:'https://api.mistral.ai',model:'mistral-small-latest'},gemini:{base:'https://generativelanguage.googleapis.com',model:'gemini-3.8-flash'}},DEF={provider:'gemini',key:'',...PD.gemini,ocrModel:'mistral-ocr-latest',perDay:10,steps:'1,3,7,16,35',saved:{}};
let tab=0,S,notions=[],flt={s:'',c:'',t:''},Q=[],cur=null,msg='';
const steps=()=>S.steps.split(',').map(Number).filter(x=>x>0),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),today=()=>new Date().toLocaleDateString('sv'),save=n=>put('notions',n);
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const busy=t=>{$('#v').innerHTML='<div class="c">'+esc(t)+'</div>'};
/* ---- Fournisseur d'IA (module interchangeable) ---- */
const Providers={mistral:{
 async call(path,body){for(let i=0;i<4;i++){let r;try{r=await fx(S.base.replace(/\/$/,'')+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.key},body:JSON.stringify(body)})}catch(e){throw e}
  if(r.status===429||r.status>=500){const w=+r.headers.get('retry-after')||3*2**i;P(`Mistral répond ${r.status} (limite ou surcharge). Nouvelle tentative ${i+1}/3 dans ${w} s…`);await new Promise(z=>setTimeout(z,w*1000));continue}
  if(!r.ok)throw new Error('Erreur '+r.status+' : '+(await r.text()).slice(0,200));return r.json()}throw new Error('LIMITE')},
 async ocr(b64,pages,sub){const j=await this.call('/v1/ocr',{model:S.ocrModel,document:{type:'document_url',document_url:'data:application/pdf;base64,'+b64},pages:sub?undefined:pages});return j.pages.map(p=>p.markdown)},
 async json(sys,user){const j=await this.call('/v1/chat/completions',{model:S.model,response_format:{type:'json_object'},temperature:.2,messages:[{role:'system',content:sys},{role:'user',content:user}]});return JSON.parse(j.choices[0].message.content)}}};
Providers.gemini={
 async call(model,body){for(let i=0;i<4;i++){let r;try{r=await fx(`${S.base.replace(/\/$/,'')}/v1beta/models/${model}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.key},body:JSON.stringify(body)})}catch(e){throw e}
  if(r.status===429||r.status>=500){const w=+r.headers.get('retry-after')||5*2**i;P(`Google répond ${r.status} (limite ou surcharge). Nouvelle tentative ${i+1}/3 dans ${w} s…`);await new Promise(z=>setTimeout(z,w*1000));continue}
  if(!r.ok)throw new Error('Erreur '+r.status+' : '+(await r.text()).slice(0,200));const j=await r.json();return((j.candidates&&j.candidates[0]&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join('')}throw new Error('LIMITE')},
 async ocr(b64,pages,sub){const a=sub?1:pages[0]+1,b=sub?sub:pages[pages.length-1]+1,t=await this.call(S.model,{contents:[{parts:[{inline_data:{mime_type:'application/pdf',data:b64}},{text:`Transcris fidèlement en markdown le texte des pages ${a} à ${b} de ce PDF (formules, tableaux et légendes de schémas inclus). Avant chaque page, écris une ligne exacte : === PAGE n === (n = numéro de page du PDF). Rien d’autre.`}]}],generationConfig:{temperature:0}}),parts=t.split(/=== PAGE \d+ ===/).slice(1).map(x=>x.trim());return parts.length?parts:[t]},
 async json(sys,user){const t=await this.call(S.model,{systemInstruction:{parts:[{text:sys}]},contents:[{parts:[{text:user}]}],generationConfig:{temperature:.2,responseMimeType:'application/json'}});return JSON.parse(t.replace(/^```json|```$/g,'').trim())}};
const AI=()=>Providers[S.provider]||Providers.gemini;
const SYS='Tu es un assistant pédagogique pour un technicien en maintenance industrielle (TMI). À partir de l’extrait de cours fourni (marqueurs [Page n]), produis des notions de révision en français, fidèles au cours, sans rien inventer. Réponds uniquement par un JSON valide : {"matiere":"","chapitre":"","notions":[{"type":"définition|formule|procédure|schéma|comparaison|autre","q":"question","a":"réponse courte","expl":"explication","page":1,"tags":[""],"cloze":{"t":"phrase avec ___","r":["mot"]},"tf":{"s":"affirmation","v":true,"j":"justification"},"mcq":{"good":"","bad":["","",""]},"methods":["flash","qcm","vf","trous"]}]}. Ne remplis cloze, tf et mcq que si c’est pertinent, et ne liste dans methods que les méthodes dont le contenu est fourni (flash est toujours possible). Environ 8 à 15 notions par extrait.';
/* ---- Méthodes de révision (modules indépendants) ---- */
const M={
flash:{nom:'Flashcard',ok:n=>!!(n.q&&n.a),ask:'{"q":"question","a":"réponse courte"}',render(n,el,done){el.innerHTML=`<p class="q">${esc(n.q)}</p><button class="b" id="fl">Retourner</button>`;$('#fl').onclick=()=>{el.innerHTML=`<p class="q">${esc(n.q)}</p><p class="an">${esc(n.a)}</p><p><small>Comment as-tu répondu ?</small></p><div class="row">`+['Raté','Difficile','Bien','Facile'].map((l,i)=>`<button class="b g" data-g="${i}">${l}</button>`).join('')+'</div>';el.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{el.querySelectorAll('button').forEach(c=>c.disabled=true);done(+b.dataset.g)})}}},
qcm:{nom:'QCM',ok:n=>!!(n.mcq&&n.mcq.good&&(n.mcq.bad||[]).length>=2),ask:'{"mcq":{"good":"bonne réponse","bad":["faux 1","faux 2","faux 3"]}}',render(n,el,done){const o=[n.mcq.good,...n.mcq.bad].map((t,i)=>({t,g:!i})).sort(()=>Math.random()-.5);el.innerHTML=`<p class="q">${esc(n.q)}</p>`+o.map((x,i)=>`<button class="b g" data-i="${i}">${esc(x.t)}</button>`).join('');el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const x=o[b.dataset.i];el.querySelectorAll('[data-i]').forEach((c,i)=>{c.disabled=true;if(o[i].g)c.classList.add('ok');else if(c===b)c.classList.add('ko')});done(x.g?2:0)})}},
vf:{nom:'Vrai/faux',ok:n=>!!(n.tf&&n.tf.s),ask:'{"tf":{"s":"affirmation","v":true,"j":"justification"}}',render(n,el,done){el.innerHTML=`<p class="q">${esc(n.tf.s)}</p><button class="b g" data-v="1">Vrai</button><button class="b g" data-v="0">Faux</button>`;el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const r=(b.dataset.v==='1')===!!n.tf.v;el.querySelectorAll('button').forEach(c=>c.disabled=true);b.classList.add(r?'ok':'ko');done(r?2:0,n.tf.j)})}},
trous:{nom:'Texte à trous',ok:n=>!!(n.cloze&&n.cloze.t&&(n.cloze.r||[]).length),ask:'{"cloze":{"t":"phrase avec ___ à la place du mot clé","r":["mot clé"]}}',render(n,el,done){el.innerHTML=`<p class="q">${esc(n.cloze.t)}</p><input id="ti" autocapitalize="none" autocomplete="off" placeholder="Ta réponse"><button class="b" id="tv">Valider</button>`;$('#tv').onclick=()=>{const ok=n.cloze.r.some(x=>norm(x)===norm($('#ti').value));$('#ti').disabled=true;$('#tv').remove();done(ok?2:0,ok?'':'Réponse attendue : '+n.cloze.r.join(' / '))}}}};
const avail=n=>(n.methods||[]).filter(k=>M[k]&&M[k].ok(n));
const state=n=>!n.srs?'new':Object.values(n.srs.hist).filter(a=>a.at(-1)===1).length>=2?'mastered':'learning';
const pct=a=>Math.round(100*a.filter(n=>state(n)==='mastered').length/a.length);
/* ---- Répétition espacée ---- */
const pool=()=>notions.filter(n=>(!flt.s||n.s===flt.s)&&(!flt.c||n.c===flt.c)&&(!flt.t||(n.tags||[]).includes(flt.t))&&avail(n).length);
const newCount=async()=>{const k=await get('kv','newlog');return k&&k.d===today()?k.n:0};
async function dueList(){const now=Date.now(),p=pool();return{d:p.filter(n=>n.srs&&n.srs.due<=now).sort((a,b)=>a.srs.due-b.srs.due),nw:p.filter(n=>!n.srs).slice(0,Math.max(0,S.perDay-await newCount()))}}
async function start(){const{d,nw}=await dueList();Q=[...d,...nw];next()}
const pick=n=>{const h=n.srs?n.srs.hist:{};return avail(n).sort((a,b)=>((h[a]||[]).length-(h[b]||[]).length)||(a===(n.srs&&n.srs.last)?1:-1))[0]};
function next(){cur=Q.shift();if(!cur){msg='Séance terminée.';return render()}
 const f=pick(cur);$('#v').innerHTML=`<div class="c"><small>${esc(cur.s)} · ${esc(cur.c)} · ${M[f].nom}</small><div id="ex"></div></div><button class="b g" id="stop">Arrêter la séance</button>`;
 $('#stop').onclick=()=>{Q=[];render()};M[f].render(cur,$('#ex'),async(g,x)=>{await answer(cur,f,g);feedback(cur,g,x)})}
async function answer(n,f,g){const x=n.srs||(n.srs={step:-1,due:0,hist:{},last:''}),first=x.step===-1&&!Object.keys(x.hist).length,st=steps(),now=Date.now();
 (x.hist[f]=x.hist[f]||[]).push(g>=2?1:0);x.last=f;
 if(g===0){x.step=Math.max(0,x.step-1);x.due=now+6e5;Q.push(n)}
 else{x.step=Math.max(0,x.step+(g===1?0:g===3?2:1));x.due=now+Math.max(1,Math.round(st[Math.min(x.step,st.length-1)]*(g===1?.7:g===3?1.2:1)))*864e5}
 await save(n);if(first)await put('kv',{d:today(),n:await newCount()+1},'newlog');
 const L=(await get('kv','log'))||{},d=L[today()]||{n:0,ok:0};d.n++;d.ok+=g>=2?1:0;L[today()]=d;await put('kv',L,'log')}
function feedback(n,g,x){const ok=g>=2;$('#ex').insertAdjacentHTML('beforeend',`<div><b class="${ok?'okt':'kot'}">${ok?'Réussi':'À revoir'}</b>${x?`<p>${esc(x)}</p>`:''}<p class="an">${esc(n.a)}</p>${n.e?`<p>${esc(n.e)}</p>`:''}${n.page?`<small>Page ${esc(n.page)} du cours</small>`:''}<button class="b" id="nx">Suivant</button></div>`);$('#nx').onclick=next}
/* ---- Écrans ---- */
async function stats(){const L=(await get('kv','log'))||{};let w='';for(let i=6;i>=0;i--){const n=(L[new Date(Date.now()-i*864e5).toLocaleDateString('sv')]||{}).n||0;w+=`<span class="dot" style="opacity:${n?1:.25}">${n||'·'}</span>`}
 return '<h2>Statistiques</h2><div class="c">Notions revues ces 7 derniers jours<div class="wk">'+w+'</div></div>'+[...new Set(notions.map(n=>n.s))].map(s=>{const ns=notions.filter(n=>n.s===s),c={new:0,learning:0,mastered:0};let a=0,b=0;const miss=[];ns.forEach(n=>{c[state(n)]++;if(!n.srs)return;let z=0;Object.values(n.srs.hist).forEach(h=>{a+=h.length;b+=h.filter(Boolean).length;z+=h.filter(x=>!x).length});if(z)miss.push([z,n.q])});miss.sort((x,y)=>y[0]-x[0]);
 return `<div class="c"><b>${esc(s)}</b><br>${c.new} nouvelles · ${c.learning} en cours · ${c.mastered} maîtrisées<br>Réussite : ${a?Math.round(100*b/a)+' %':'—'}${miss.length?'<br><small>Les plus ratées : '+miss.slice(0,3).map(m=>esc(m[1])+' ('+m[0]+')').join(' ; ')+'</small>':''}</div>`}).join('')}
async function viewToday(){const{d,nw}=await dueList(),sel=(k,l,a)=>`<select data-f="${k}"><option value="">${l}</option>${a.map(x=>`<option ${flt[k]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
 return `<h1>Aujourd’hui</h1><div class="c"><b>${d.length}</b> à revoir · <b>${nw.length}</b> nouvelles</div><button class="b" id="go" ${d.length+nw.length?'':'disabled'}>Réviser</button>`+sel('s','Toutes les matières',[...new Set(notions.map(n=>n.s))])+sel('c','Tous les chapitres',[...new Set(notions.filter(n=>!flt.s||n.s===flt.s).map(n=>n.c))])+sel('t','Toutes les étiquettes',[...new Set(notions.flatMap(n=>n.tags||[]))])+await stats()}
function viewCourses(){if(!notions.length)return '<h1>Cours</h1><div class="c">Aucune notion pour l’instant. Importe un PDF dans l’onglet Importer.</div>';
 const A=(a,s,c,id,l)=>`<button class="b g" data-a="${a}" data-s="${esc(s)}" data-c="${esc(c||'')}" data-id="${id||''}">${l}</button>`;
 return '<h1>Cours</h1>'+[...new Set(notions.map(n=>n.s))].sort().map(s=>{const sn=notions.filter(n=>n.s===s);return `<details class="c" open><summary><b>${esc(s)}</b> <small>${pct(sn)} % maîtrisé</small></summary><div class="row">${A('rs',s,'','','Renommer')}${A('am',s,'','','+ Méthode')}</div>`+[...new Set(sn.map(n=>n.c))].sort().map(c=>{const cn=sn.filter(n=>n.c===c);return `<details class="ch"><summary>${esc(c)} <small>${pct(cn)} %</small></summary><div class="row">${A('rc',s,c,'','Renommer')}${A('mc',s,c,'','Déplacer')}${A('am',s,c,'','+ Méthode')}</div>`+cn.map(n=>`<div class="nt"><span>${esc(n.q)}<br><small>${avail(n).map(k=>M[k].nom).join(', ')}</small></span><div class="row">${A('mn',s,c,n.id,'Déplacer')}${A('am',s,c,n.id,'+ Méthode')}${A('dn',s,c,n.id,'Suppr.')}</div></div>`).join('')+'</details>'}).join('')+'</details>'}).join('')}
async function viewImport(){const js=await all('jobs');return `<h1>Importer</h1><div class="c"><p>Un chapitre à la fois : indique les pages du PDF qui le composent.</p><input type="file" id="pf" accept="application/pdf"><div class="row2"><input id="p1" type="number" min="1" placeholder="Page début"><input id="p2" type="number" min="1" placeholder="Page fin"></div><button class="b" id="conv">Convertir ce chapitre</button></div>`+(js.length?'<h2>Imports en cours</h2>'+js.map(j=>`<div class="c"><b>${esc(j.name)}</b><br><small>pages ${j.from} à ${j.to} · ${esc(j.status)}</small><button class="b" data-a="jr" data-id="${j.id}">${j.chunks.length&&j.ci>=j.chunks.length?'Relire les notions':'Reprendre'}</button><button class="b g" data-a="jd" data-id="${j.id}">Supprimer</button></div>`).join(''):'')}
const viewSet=()=>`<h1>Réglages</h1><div class="c"><label>Fournisseur d’IA<select id="spv"><option value="gemini" ${S.provider==='gemini'?'selected':''}>Google Gemini</option><option value="mistral" ${S.provider==='mistral'?'selected':''}>Mistral</option></select></label><label>Clé d’API<input id="sk" type="password" value="${esc(S.key)}" autocomplete="off"></label><label>Nouvelles notions par jour<input id="sp" type="number" min="0" value="${S.perDay}"></label><label>Intervalles en jours<input id="ss" value="${esc(S.steps)}"></label><label>Modèle de génération<input id="sm" value="${esc(S.model)}"></label><label>Adresse de l’API (ou d’un relais)<input id="sb" value="${esc(S.base)}"></label><button class="b" id="sv">Enregistrer</button></div><div class="c"><button class="b" id="ex2">Exporter une sauvegarde</button><label class="b g">Restaurer une sauvegarde<input type="file" id="im" accept="application/json" hidden></label></div><div class="c"><p>Un problème ? Copie le rapport et envoie-le moi. Il ne contient pas ta clé d’API.</p><button class="b g" id="rp">Copier le rapport</button></div>`;
async function render(){const h=[viewToday,viewCourses,viewImport,viewSet][tab];const html=await h();$('#v').innerHTML=(msg?`<div class="c">${esc(msg)}</div>`:'')+html;msg='';document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('on',i===tab));bind()}
function bind(){const v=$('#v'),on=(i,f)=>$(i)&&($(i).onclick=f);v.onclick=e=>{const b=e.target.closest('[data-a]');if(b)act(b)};v.onchange=e=>{const f=e.target.dataset.f;if(f){flt[f]=e.target.value;if(f==='s')flt.c='';render()}};on('#go',start);on('#conv',conv);on('#sv',saveSet);on('#ex2',exportB);on('#rp',report);if($('#im'))$('#im').onchange=importB;if($('#spv'))$('#spv').onchange=switchP}
async function switchP(){const o=S.provider,n=$('#spv').value;S.saved={...S.saved,[o]:{key:$('#sk').value.trim(),base:$('#sb').value.trim(),model:$('#sm').value.trim()}};S={...S,provider:n,key:'',...PD[n],...(S.saved[n]||{})};await put('kv',S,'settings');render()}
/* ---- Actions Cours ---- */
async function addMethod(ns,key){const m=M[key];let i=0;try{for(const n of ns){busy(`Ajout de la méthode… ${++i}/${ns.length}`);if(!(n.methods||[]).includes(key))n.methods=[...(n.methods||[]),key];if(!m.ok(n))Object.assign(n,await AI().json('Tu aides à réviser un cours de maintenance industrielle. Réponds uniquement par un JSON valide, en français, de la forme '+m.ask,`Notion : ${n.q}\nRéponse : ${n.a}\nExplication : ${n.e||''}`));await save(n)}msg='Méthode ajoutée.'}catch(e){rep('Méthode : '+e.message);msg=e.message==='LIMITE'?'Limite de l’API atteinte : ce qui est déjà ajouté est conservé, relance plus tard.':e.message}}
async function act(b){const d=b.dataset,A=d.a;
 if(A==='jr'){const j=await get('jobs',d.id);return j.chunks.length&&j.ci>=j.chunks.length?review(j):run(j)}
 if(A==='jd'){if(confirm('Supprimer cet import ?'))await del('jobs',d.id);return render()}
 const sel=()=>notions.filter(n=>d.id?n.id===d.id:n.s===d.s&&(!d.c||n.c===d.c));
 if(A==='rs'){const v=prompt('Nouveau nom de la matière',d.s);if(v)for(const n of sel()){n.s=v.trim();await save(n)}}
 if(A==='rc'){const v=prompt('Nouveau nom du chapitre',d.c);if(v)for(const n of sel()){n.c=v.trim();await save(n)}}
 if(A==='mc'||A==='mn'){const v=prompt('Destination, au format Matière / Chapitre',d.s+' / '+d.c);if(v){const[s,c]=v.split('/').map(x=>x.trim());if(s&&c)for(const n of sel()){n.s=s;n.c=c;await save(n)}}}
 if(A==='am'){const k=['flash','qcm','vf','trous'][+prompt('Méthode à ajouter (tape le numéro) :\n1 Flashcard\n2 QCM\n3 Vrai/faux\n4 Texte à trous')-1];if(k)await addMethod(sel(),k)}
 if(A==='dn'&&confirm('Supprimer cette notion ?'))await del('notions',d.id);
 notions=await all('notions');render()}
/* ---- Import d'un chapitre ---- */
async function conv(){const f=$('#pf').files[0],a=+$('#p1').value,b=+$('#p2').value;if(!f||!a||b<a)return alert('Choisis un PDF et une plage de pages valide.');if(!S.key)return alert('Ajoute d’abord ta clé d’API dans Réglages.');
 const j={id:uid(),name:f.name,blob:new Blob([await f.arrayBuffer()],{type:'application/pdf'}),from:a,to:b,ocr:null,chunks:[],ci:0,notions:[],s:'',c:'',ri:0,status:'à convertir'};await put('jobs',j);run(j)}
let AC=null,CANCELLED=false,LOG=[],T0=0,TI=null,PT='';
async function fx(url,o,ms=150000){if(CANCELLED)throw new Error('Annulé.');const c=new AbortController();AC=c;const t=setTimeout(()=>c.abort('timeout'),ms);try{return await fetch(url,{...o,signal:c.signal})}catch(e){throw new Error(c.signal.reason==='timeout'?'Délai dépassé ('+ms/1000+' s) : pas de réponse du fournisseur d’IA.':c.signal.reason==='user'?'Annulé.':'Appel bloqué (réseau ou CORS). Vérifie la connexion, ou renseigne l’adresse d’un relais dans Réglages.')}finally{clearTimeout(t)}}
function P(l){if(l)LOG.push(new Date().toLocaleTimeString('fr-FR')+'  '+l);drawP()}
function drawP(){const v=$('#v');if(!$('#plog')){v.innerHTML='<h1 id="pt"></h1><div class="c"><b id="pel"></b><pre id="plog"></pre></div><button class="b g" id="pcancel">Annuler</button>';$('#pcancel').onclick=()=>{CANCELLED=true;if(AC)AC.abort('user')}}$('#pt').textContent=PT;$('#plog').textContent=LOG.slice(-14).join('\n')}
function startP(t){LOG=[];T0=Date.now();PT=t;CANCELLED=false;clearInterval(TI);TI=setInterval(()=>{const e=$('#pel');if(e)e.textContent='Temps écoulé : '+Math.floor((Date.now()-T0)/1000)+' s';else clearInterval(TI)},1000);drawP()}
const mo=b=>(b/1048576).toFixed(1)+' Mo';
async function run(j){startP('Conversion : '+j.name);try{
 P(`Fichier ${mo(j.blob.size)} · pages ${j.from} à ${j.to} · fournisseur ${S.provider} · modèle ${S.model}`);
 if(!j.done){j.ocr=j.ocr||[];P('Préparation du PDF…');let src=null;
  if(window.PDFLib){try{src=await PDFLib.PDFDocument.load(await j.blob.arrayBuffer(),{ignoreEncryption:true});P(`Le PDF compte ${src.getPageCount()} pages.`)}catch(e){P('Découpe impossible ('+e.message+') : envoi du PDF entier.')}}
  const N=src?src.getPageCount():0;if(src&&j.from>N)throw new Error('La page de début dépasse la taille du PDF.');
  const last=src?Math.min(j.to,N):j.to;let B=src?4:last-j.from+1;
  while(j.from+j.ocr.length<=last){const a=j.from+j.ocr.length,b=Math.min(a+B-1,last);let blob=j.blob,sub=0;
   if(src){const out=await PDFLib.PDFDocument.create(),idx=[];for(let i=a-1;i<b;i++)idx.push(i);(await out.copyPages(src,idx)).forEach(x=>out.addPage(x));blob=new Blob([await out.save()],{type:'application/pdf'});sub=idx.length;if(blob.size>15*1048576&&b>a){B=1;P(`Pages ${a} à ${b} trop lourdes (${mo(blob.size)}) : lecture page par page.`);continue}}
   P(`Pages ${a} à ${b} : envoi de ${mo(blob.size)}…`);
   const b64=await new Promise((res,rej)=>{const x=new FileReader();x.onload=()=>res(x.result.split(',')[1]);x.onerror=rej;x.readAsDataURL(blob)}),pg=[];for(let i=a-1;i<b;i++)pg.push(i);
   const t=await AI().ocr(b64,pg,sub),n=b-a+1;P(`Pages ${a} à ${b} lues : ${t.join('').length} caractères${t.length!==n?' (attention : '+t.length+' blocs reçus pour '+n+' pages)':''}.`);
   while(t.length<n)t.push('');j.ocr.push(...t.slice(0,n));await put('jobs',j)}
  let c='';j.chunks=[];j.ocr.forEach((t,i)=>{const p=`[Page ${j.from+i}]\n${t}\n`;if(c&&c.length+p.length>12000){j.chunks.push(c);c=''}c+=p});if(c)j.chunks.push(c);j.done=true;j.status='lecture terminée';await put('jobs',j);P(`Lecture terminée. ${j.chunks.length} lot(s) à convertir.`)}
 else P('Lecture déjà faite : reprise à la création des notions.');
 while(j.ci<j.chunks.length){P(`Lot ${j.ci+1}/${j.chunks.length} : génération des notions…`);const r=await AI().json(SYS,j.chunks[j.ci]);if(!j.s){j.s=r.matiere||'Sans matière';j.c=r.chapitre||j.name.replace(/\.pdf$/i,'')}const k=(r.notions||[]).length;j.notions.push(...(r.notions||[]));j.ci++;j.status=`${j.ci}/${j.chunks.length} lots convertis`;await put('jobs',j);P(`Lot ${j.ci} terminé : ${k} notion(s).`)}
 j.status='prêt pour la relecture';await put('jobs',j);clearInterval(TI);P(`Terminé : ${j.notions.length} notions prêtes pour la relecture.`);setTimeout(()=>review(j),1200)}
 catch(e){clearInterval(TI);await put('jobs',j);rep('Import : '+e.message);P('ÉCHEC : '+(e.message==='LIMITE'?'limite de l’API atteinte. Réessaie plus tard, rien n’est perdu.':e.message));const b=$('#pcancel');if(b)b.remove();$('#v').insertAdjacentHTML('beforeend','<button class="b" id="pre">Réessayer</button><button class="b g" id="pback">Retour à Importer</button>');$('#pre').onclick=()=>run(j);$('#pback').onclick=()=>{tab=2;render()}}}
function review(j){const v=$('#v'),n=j.notions[j.ri];if(!n){del('jobs',j.id);msg='Relecture terminée : les notions sont dans Cours.';tab=1;return render()}
 v.innerHTML=`<h1>Relecture ${j.ri+1}/${j.notions.length}</h1><div class="c"><input id="rs" value="${esc(j.s)}" aria-label="Matière"><input id="rc" value="${esc(j.c)}" aria-label="Chapitre"></div><div class="c"><small>${esc(n.type||'')}${n.page?' · page '+esc(n.page):''}</small><textarea id="rq" rows="3">${esc(n.q)}</textarea><textarea id="ra" rows="3">${esc(n.a)}</textarea><textarea id="re" rows="3" placeholder="Explication">${esc(n.expl||'')}</textarea>${Object.keys(M).map(k=>`<label class="ck"><input type="checkbox" data-m="${k}" ${(n.methods||[]).includes(k)&&M[k].ok(n)?'checked':''} ${M[k].ok(n)?'':'disabled'}> ${M[k].nom}</label>`).join('')}</div><button class="b" id="keep">Garder</button><button class="b g" id="skip">Supprimer</button><button class="b g" id="pause">Reprendre plus tard</button>`;
 $('#keep').onclick=async()=>{const m=[...v.querySelectorAll('[data-m]:checked')].map(x=>x.dataset.m);if(!m.length)return alert('Garde au moins une méthode.');j.s=$('#rs').value.trim()||j.s;j.c=$('#rc').value.trim()||j.c;
  const o={id:uid(),s:j.s,c:j.c,ty:n.type||'définition',q:$('#rq').value,a:$('#ra').value,e:$('#re').value,cloze:n.cloze,tf:n.tf,mcq:n.mcq,methods:m,tags:n.tags||[],page:n.page,src:j.name,srs:null};await save(o);notions.push(o);j.ri++;await put('jobs',j);review(j)};
 $('#skip').onclick=async()=>{j.ri++;await put('jobs',j);review(j)};$('#pause').onclick=async()=>{await put('jobs',j);msg='Relecture en pause : reprends depuis « Imports en cours ».';tab=2;render()}}
/* ---- Réglages et sauvegarde ---- */
async function saveSet(){S={...S,key:$('#sk').value.trim(),perDay:+$('#sp').value||0,steps:$('#ss').value,model:$('#sm').value.trim(),base:$('#sb').value.trim()};if(!steps().length)S.steps=DEF.steps;await put('kv',S,'settings');msg='Réglages enregistrés.';render()}
async function exportB(){const f=new File([JSON.stringify({v:1,notions,log:await get('kv','log'),settings:{perDay:S.perDay,steps:S.steps}})],`sauvegarde-revisions-${today()}.json`,{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[f]}))try{return await navigator.share({files:[f]})}catch(e){if(e.name==='AbortError')return}const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
async function importB(e){try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.notions)||!confirm(d.notions.length+' notions seront ajoutées ou mises à jour. Continuer ?'))return;for(const n of d.notions)await save(n);if(d.log)await put('kv',d.log,'log');if(d.settings){S={...S,perDay:d.settings.perDay??S.perDay,steps:d.settings.steps||S.steps};await put('kv',S,'settings')}notions=await all('notions');msg='Sauvegarde restaurée.'}catch(x){msg='Fichier de sauvegarde invalide.'}render()}
/* ---- Rapport de problèmes ---- */
let ERR=[];
function rep(m){ERR=[...ERR,new Date().toLocaleString('fr-FR')+'  '+m].slice(-20);const v=$('#v');if(v&&!$('#plog'))v.insertAdjacentHTML('afterbegin','<div class="c">Une erreur est survenue : '+esc(m)+'<br><small>Réglages, puis « Copier le rapport » pour me l’envoyer.</small></div>')}
addEventListener('error',e=>rep('JS : '+e.message+' (ligne '+e.lineno+')'));addEventListener('unhandledrejection',e=>rep('Promesse : '+((e.reason&&e.reason.message)||e.reason)));
async function report(){const t=['Rapport Révisions TMI — version 3',navigator.userAgent,`Fournisseur : ${S.provider} · modèle : ${S.model} · adresse : ${S.base}`,`Notions : ${notions.length} · limite par jour : ${S.perDay}`,'','Erreurs récentes :',...(ERR.length?ERR:['aucune']),'','Dernier journal d’import :',...(LOG.length?LOG:['aucun'])].join('\n');
 try{await navigator.clipboard.writeText(t);alert('Rapport copié. Colle-le dans la conversation avec Claude.')}catch(e){$('#v').insertAdjacentHTML('beforeend','<div class="c"><small>Sélectionne et copie ce texte :</small><textarea rows="12" readonly>'+esc(t)+'</textarea></div>')}}
/* ---- Démarrage ---- */
$('nav').innerHTML=T.map(t=>`<button>${t}</button>`).join('');document.querySelectorAll('nav button').forEach((b,i)=>b.onclick=()=>{Q=[];tab=i;render()});
(async()=>{S={...DEF,...(await get('kv','settings')||{})};notions=await all('notions');render();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')})();
</script></body></html>
